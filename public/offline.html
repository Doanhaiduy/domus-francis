<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mất kết nối — Lưu Xá Phanxicô</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #faf8ff; color: #131b2e; }
    @media (prefers-color-scheme: dark) { body { background: #12111a; color: #ece9f8; } .card { background: #1c1b2a !important; border-color: #32314a !important; } p { color: #b6b2cb !important; } }
    .card { max-width: 360px; margin: 24px; padding: 32px 28px; text-align: center; background: #fff; border: 1px solid #e6deff; border-radius: 24px; }
    .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #5f3add, #7857f8); color: #fff; font-size: 28px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #6b7280; margin: 0 0 20px; }
    button { border: 0; border-radius: 12px; background: #5f3add; color: #fff; font-weight: 700; font-size: 14px; padding: 12px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">✝</div>
    <h1>Bạn đang mất kết nối</h1>
    <p>Không tải được trang. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại nhé.</p>
    <button type="button" onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
